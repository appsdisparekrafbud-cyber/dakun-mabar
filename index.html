<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>DAKUN MABAR</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    .card {
      width: min(92vw, 520px);
      box-sizing: border-box;
      padding: 32px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 18px;
      box-shadow: 0 14px 40px rgba(0,0,0,.08);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }
    p {
      margin: 8px 0;
      line-height: 1.5;
    }
    .spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    a {
      color: #2563eb;
      word-break: break-all;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    const APP_URL = 'https://script.google.com/macros/s/AKfycbwh78E9ed0zKty37FyUZAY6ytH4byIDe23G0gRprMbPJ8-MNX9K3XCps2Ck0AuJpNJz/exec';

    // Redirect ke aplikasi utama.
    // Saat URL Apps Script berubah, cukup ubah APP_URL di file ini.
    window.location.replace(APP_URL);
  </script>
</head>
<body>
  <main class="card">
    <h1>DAKUN MABAR</h1>
    <p>Data Kunjungan Wisatawan Manggarai Barat</p>
    <div class="spinner" aria-hidden="true"></div>
    <p>Menghubungkan ke aplikasi...</p>
    <p>
      Jika halaman tidak berpindah otomatis,
      <a id="manualLink" href="https://script.google.com/macros/s/AKfycbwh78E9ed0zKty37FyUZAY6ytH4byIDe23G0gRprMbPJ8-MNX9K3XCps2Ck0AuJpNJz/exec">klik di sini</a>.
    </p>
  </main>
</body>
</html>
